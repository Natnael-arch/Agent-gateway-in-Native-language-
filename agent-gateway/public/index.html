<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agelgay - AI Assistant</title>
  
  <!-- Google Fonts: Noto Sans Ethiopic & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #161f30;
      --bg-input: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Ochre user bubble colors */
      --user-ochre-from: #d97706;
      --user-ochre-to: #b45309;
      --user-text: #ffffff;
      
      /* Agent reply bubble */
      --agent-bg: #1e293b;
      --agent-border: rgba(255, 255, 255, 0.08);
      
      /* Confirmation teal card */
      --teal-bg: rgba(13, 148, 136, 0.12);
      --teal-border: #0d9488;
      --teal-accent: #14b8a6;
      
      /* Error red card */
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: #ef4444;
      --error-text: #fca5a5;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans Ethiopic', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 44px Custom Electron Title Bar (#0e1420) */
    .custom-titlebar {
      height: 44px;
      background-color: #0e1420;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 100;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .titlebar-flag {
      font-size: 1.1rem;
    }

    .titlebar-wordmark {
      font-weight: 700;
      color: #f8fafc;
    }

    .titlebar-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      -webkit-app-region: no-drag;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .dot.offline {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    /* Window Control Dots */
    .window-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .window-control {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      transition: opacity 0.15s, transform 0.15s;
    }

    .window-control:hover {
      opacity: 0.85;
      transform: scale(1.1);
    }

    .window-minimize {
      background-color: #f59e0b; /* Yellow */
    }

    .window-maximize {
      background-color: #10b981; /* Green */
    }

    .window-close {
      background-color: #ef4444; /* Red */
    }

    .window-control.inert {
      cursor: default;
      opacity: 0.6;
    }

    .window-control.inert:hover {
      opacity: 0.6;
      transform: none;
    }

    /* App Header / Toolbar */
    .app-header {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .url-input {
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      width: 180px;
    }

    /* Language Toggle Pill */
    .lang-pill-btn {
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.2) 0%, rgba(180, 83, 9, 0.2) 100%);
      border: 1px solid var(--user-ochre-from);
      color: #fef3c7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .lang-pill-btn:hover {
      background: linear-gradient(135deg, var(--user-ochre-from) 0%, var(--user-ochre-to) 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.3);
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Chat Viewport */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      user-select: text;
    }

    .chat-container {
      width: 100%;
      max-width: 760px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Chat Messages */
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.agent {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .message-row.user .message-bubble {
      background: linear-gradient(135deg, var(--user-ochre-from) 0%, var(--user-ochre-to) 100%);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.25);
    }

    .message-row.agent .message-bubble {
      background-color: var(--agent-bg);
      border: 1px solid var(--agent-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    /* Pipeline Status Indicator Bubble */
    .pipeline-status-card {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(8px);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      animation: fadeIn 0.2s ease-out;
    }

    .pulse-ring {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--teal-accent);
      position: relative;
    }

    .pulse-ring::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 50%;
      background-color: var(--teal-accent);
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Teal Confirmation Card (Restyled) */
    .confirmation-card {
      width: 100%;
      max-width: 540px;
      align-self: flex-start;
      background: var(--teal-bg);
      border: 1.5px solid var(--teal-border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.18);
      animation: fadeIn 0.25s ease-out;
    }

    .conf-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--teal-accent);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .conf-body {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #f1f5f9;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--teal-accent);
    }

    .conf-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-confirm {
      flex: 1;
      background: var(--teal-accent);
      color: #042f2e;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .btn-confirm:hover {
      background: #2dd4bf;
      transform: translateY(-1px);
    }

    .btn-cancel {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cancel:hover {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
    }

    /* Language Picker Card */
    .language-picker {
      width: 100%;
      max-width: 540px;
      align-self: center;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.25s ease-out;
    }

    .language-picker .lp-title {
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.5;
    }

    .language-picker .lp-subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
    }

    .lp-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-lang {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .btn-lang:hover {
      background: rgba(217, 119, 6, 0.2);
      border-color: var(--user-ochre-from);
      transform: translateY(-1px);
    }

    /* System Message Bubble */
    .message-row.system {
      align-self: center;
      max-width: 90%;
    }

    .message-row.system .message-bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      border-radius: var(--radius-md);
      padding: 8px 14px;
    }

    /* Error Card */
    .error-card {
      align-self: flex-start;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Debug Metrics Footer Badge */
    .debug-badge {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', monospace;
    }

    .debug-badge span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Suggestion Prompt Chips Bar */
    .suggestions-bar {
      width: 100%;
      max-width: 760px;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .suggestions-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .chip:hover {
      background: rgba(217, 119, 6, 0.15);
      border-color: var(--user-ochre-from);
      color: #fef3c7;
    }

    /* Bottom Composer Container */
    .composer-container {
      width: 100%;
      max-width: 760px;
      padding: 12px 16px 20px 16px;
      background: var(--bg-main);
    }

    .composer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 6px 8px 6px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s;
    }

    .composer-box:focus-within {
      border-color: var(--user-ochre-from);
    }

    .composer-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 8px 0;
      resize: none;
      max-height: 120px;
    }

    .composer-input::placeholder {
      color: #64748b;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #64748b;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-send {
      background: linear-gradient(135deg, var(--user-ochre-from) 0%, var(--user-ochre-to) 100%);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn-send:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Custom 44px Top Electron Title Bar -->
  <div class="custom-titlebar">
    <div class="titlebar-left">
      <span class="titlebar-flag">🇪🇹</span>
      <span class="titlebar-wordmark">Agelgay</span>
      <span class="titlebar-subtitle">| የእርስዎ አርቴፊሻል ኢንተለጀንስ ረዳት</span>
    </div>

    <div class="titlebar-right">
      <div class="status-badge" id="serverStatusBadge">
        <div class="dot" id="serverDot"></div>
        <span id="serverStatusText">Online</span>
      </div>

      <div class="window-controls">
        <button class="window-control window-minimize" id="btnMinimize" title="Minimize" aria-label="Minimize"></button>
        <button class="window-control window-maximize" id="btnMaximize" title="Maximize" aria-label="Maximize"></button>
        <button class="window-control window-close" id="btnClose" title="Close" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Secondary App Header / Controls -->
  <header class="app-header">
    <div class="header-left">
      <input type="text" id="baseUrlInput" class="url-input" value="http://localhost:3000" placeholder="Base URL">
    </div>

    <div class="header-controls">
      <!-- Language Toggle Pill -->
      <button class="lang-pill-btn" id="langToggle" onclick="toggleLanguage()" title="Switch language / ቋንቋ ቀይር">🇪🇹 አማርኛ</button>

      <button class="btn-action" onclick="resetSession()" title="Reset conversation session">New Session</button>
    </div>
  </header>

  <!-- Main Chat Viewport -->
  <main>
    <div class="chat-container" id="chatContainer">
      <!-- Content rendered by JS (language picker + welcome) -->
    </div>

    <!-- Suggestion Prompt Chips -->
    <div class="suggestions-bar">
      <div class="chip" onclick="sendSuggestion('ሰላም፤ 5 + 5 ስንት ይሆናል?')">💡 5 + 5 ስንት ነው?</div>
      <div class="chip" onclick="sendSuggestion('በኢትዮጵያ የሚገኙ ዋና ዋና ከተሞች የትኞቹ ናቸው?')">🇪🇹 ዋና ዋና ከተሞች</div>
      <div class="chip" onclick="sendSuggestion('እባክህ ስለ አየር ሁኔታ አስተያየትህን ጻፍ')">🌦️ ስለ አየር ሁኔታ ጻፍ</div>
      <div class="chip" onclick="sendSuggestion('500 ብር ወደ አካውንት 987654 ላክ')">⚠️ እርምጃ ማረጋገጫ (500 ብር)</div>
    </div>

    <!-- Bottom Composer Bar -->
    <div class="composer-container">
      <form class="composer-box" id="chatForm" onsubmit="handleSend(event)">
        <button type="button" class="icon-btn" title="ድምፅ ግቤት (በቅርቡ የሚመጣ)" onclick="alert('ድምፅ ግቤት በቅርቡ ይለቀቃል!')">
          🎤
        </button>

        <input type="text" id="messageInput" class="composer-input" placeholder="መልእክትዎን እዚህ ይጻፉ... (Enter ለመላክ)" autocomplete="off" required>

        <button type="submit" id="sendBtn" class="btn-send">
          <span>መላክ</span>
          <span>➔</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    // Client-Side Session State
    let currentSessionId = 'session_' + Math.random().toString(36).substring(2, 9);
    let currentLanguage = 'am';

    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const baseUrlInput = document.getElementById('baseUrlInput');
    const serverDot = document.getElementById('serverDot');
    const serverStatusText = document.getElementById('serverStatusText');
    const langToggle = document.getElementById('langToggle');

    const LANGUAGE_LABELS = {
      am: { short: 'አማ', long: '🇪🇹 አማርኛ', english: 'Amharic' },
      en: { short: 'EN', long: '🇬🇧 English', english: 'English' }
    };

    // Wire custom title bar window controls for Electron vs inert standalone browser
    function setupWindowControls() {
      const btnMin = document.getElementById('btnMinimize');
      const btnMax = document.getElementById('btnMaximize');
      const btnClose = document.getElementById('btnClose');
      const controls = [btnMin, btnMax, btnClose];

      if (window.electronAPI) {
        if (btnMin) btnMin.addEventListener('click', () => window.electronAPI.minimize());
        if (btnMax) btnMax.addEventListener('click', () => window.electronAPI.maximize());
        if (btnClose) btnClose.addEventListener('click', () => window.electronAPI.close());
      } else {
        controls.forEach(btn => {
          if (btn) {
            btn.classList.add('inert');
            btn.setAttribute('title', 'Inert in web browser');
          }
        });
      }
    }

    function getBaseUrl() {
      const val = baseUrlInput.value.trim().replace(/\/+$/, '');
      if (val) return val;
      return (window.location.origin && window.location.origin !== 'null') ? window.location.origin : 'http://localhost:3000';
    }

    if (window.location.origin && window.location.origin !== 'null' && window.location.protocol.startsWith('http')) {
      baseUrlInput.value = window.location.origin;
    }

    function updateLangToggle() {
      const label = LANGUAGE_LABELS[currentLanguage];
      langToggle.textContent = label.long;
      langToggle.title = currentLanguage === 'am'
        ? 'Switch to English language'
        : 'ወደ አማርኛ ቋንቋ ቀይር (Switch to Amharic)';
    }

    async function selectLanguage(lang) {
      if (lang !== 'am' && lang !== 'en') return;

      const picker = document.getElementById('languagePicker');
      const isInitialPick = picker && !picker.classList.contains('hidden');
      if (currentLanguage === lang && !isInitialPick) return;

      const previous = currentLanguage;
      currentLanguage = lang;
      updateLangToggle();

      try {
        const res = await fetch(`${getBaseUrl()}/api/session/language`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: currentSessionId, language: lang })
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
      } catch (err) {
        currentLanguage = previous;
        updateLangToggle();
        appendErrorMessage(err.message || 'ቋንቋ መቀየር አልተቻለም።');
        return;
      }

      if (picker) picker.classList.add('hidden');

      const msg = currentLanguage === 'en'
        ? 'Language changed to English. / ቋንቋ ወደ እንግሊዝኛ ተቀይሯል።'
        : 'ቋንቋ ወደ አማርኛ ተቀይሯል። / Language changed to Amharic.';
      appendSystemMessage(msg);

      messageInput.placeholder = lang === 'en'
        ? 'Type your message in English... (Enter to send)'
        : 'መልእክትዎን እዚህ ይጻፉ... (Enter ለመላክ)';
      scrollToBottom();
    }

    function toggleLanguage() {
      selectLanguage(currentLanguage === 'am' ? 'en' : 'am');
    }

    function appendSystemMessage(text) {
      const row = document.createElement('div');
      row.className = 'message-row system';
      row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      chatContainer.appendChild(row);
    }

    function renderLanguagePicker() {
      const card = document.createElement('div');
      card.className = 'language-picker';
      card.id = 'languagePicker';
      card.innerHTML = `
        <div class="lp-title">ሰላም! ወደ አገልጋይ እንኳን በደህና መጡ።<br>Choose your language / ቋንቋዎን ይምረጡ</div>
        <div class="lp-subtitle">Amharic responses are translated via the 3-step pipeline; English goes straight to the assistant.</div>
        <div class="lp-buttons">
          <button class="btn-lang" onclick="selectLanguage('am')">🇪🇹 አማርኛ</button>
          <button class="btn-lang" onclick="selectLanguage('en')">🇬🇧 English</button>
        </div>
      `;
      chatContainer.appendChild(card);
    }

    function initChat() {
      currentSessionId = 'session_' + Math.random().toString(36).substring(2, 9);
      chatContainer.innerHTML = '';

      renderLanguagePicker();

      const welcome = document.createElement('div');
      welcome.className = 'message-row agent';
      welcome.innerHTML = `
        <div class="message-bubble">
👋 **ሰላም! ወደ አገልጋይ እንኳን በደህና መጡ።** እንዴት ልርዳዎት እችላለሁ?
        </div>
      `;
      chatContainer.appendChild(welcome);

      messageInput.placeholder = 'መልእክትዎን እዚህ ይጻፉ... (Enter ለመላክ)';
      updateLangToggle();
      scrollToBottom();
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${getBaseUrl()}/health`, { signal: AbortSignal.timeout(3000) });
        if (res.ok) {
          const data = await res.json();
          serverDot.classList.remove('offline');
          serverStatusText.textContent = `Online (${data.mockTranslationMode ? 'Mock' : 'Live'})`;
        } else {
          throw new Error();
        }
      } catch (e) {
        serverDot.classList.add('offline');
        serverStatusText.textContent = 'Offline';
      }
    }

    setInterval(checkHealth, 10000);
    checkHealth();
    setupWindowControls();
    initChat();

    function resetSession() {
      initChat();
    }

    function sendSuggestion(text) {
      messageInput.value = text;
      handleSend(new Event('submit'));
    }

    async function readSSEStream(url, options, onEvent) {
      const response = await fetch(url, options);

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || errorData.message || `Server Error ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let receivedTerminalEvent = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop();

        for (const block of blocks) {
          const trimmed = block.trim();
          if (!trimmed) continue;

          const dataLines = trimmed
            .split('\n')
            .filter(line => line.startsWith('data: '))
            .map(line => line.substring(6));

          for (const dataStr of dataLines) {
            try {
              const event = JSON.parse(dataStr);
              if (event.type === 'result' || event.type === 'error') {
                receivedTerminalEvent = true;
              }
              onEvent(event);
            } catch (e) {
              console.error('SSE parse error:', dataStr, e);
            }
          }
        }
      }

      if (!receivedTerminalEvent) {
        throw new Error('የግንኙነት መስመሩ በድንገት ተቋርጧል። እባክዎን እንደገና ይሞክሩ።');
      }
    }

    const STAGE_CONFIG = {
      translate_in: { step: '1/3', label: 'ጥያቄዎን በመተንተን ላይ...' },
      hermes: { step: '2/3', label: 'መልስ በመፈለግ እና በመስራት ላይ...' },
      translate_out: { step: '3/3', label: 'መልሱን በማዘጋጀት ላይ...' }
    };

    const EN_STAGE_CONFIG = {
      hermes: { step: '1/1', label: 'Processing your request...' }
    };

    function stageConfigFor() {
      return currentLanguage === 'en' ? EN_STAGE_CONFIG : STAGE_CONFIG;
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      appendUserMessage(text);
      messageInput.value = '';
      sendBtn.disabled = true;

      const pipelineCard = appendPipelineIndicator();
      updatePipelineStageStart(pipelineCard, currentLanguage === 'en' ? 'hermes' : 'translate_in');
      let finalResult = null;

      try {
        await readSSEStream(`${getBaseUrl()}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            sessionId: currentSessionId
          })
        }, (event) => {
          if (event.type === 'stage') {
            if (event.status === 'start') {
              updatePipelineStageStart(pipelineCard, event.stage);
            } else if (event.status === 'done') {
              updatePipelineStageDone(pipelineCard, event.stage, event.durationMs);
            }
          } else if (event.type === 'result' || event.type === 'error') {
            finalResult = event;
          }
        });

        pipelineCard?.remove();

        if (finalResult) {
          if (finalResult.type === 'error') {
            throw new Error(finalResult.message || 'ስህተት አጋጥሟል');
          } else if (finalResult.requires_confirmation || finalResult.status === 'confirmation_required') {
            appendConfirmationCard(finalResult);
          } else if (finalResult.status === 'success') {
            appendAgentMessage(finalResult.amharicResponse, finalResult.timing, finalResult.englishResponse);
          } else {
            throw new Error(finalResult.message || 'ስህተት አጋጥሟል');
          }
        }

      } catch (err) {
        pipelineCard?.remove();
        appendErrorMessage(err.message || 'ይቅርታ፣ ጥያቄዎን ማስተላለፍ አልቻልኩም። እባክዎ እንደገና ይሞክሩ።');
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    }

    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    function appendAgentMessage(amharicText, timing = null, englishResponse = null) {
      const row = document.createElement('div');
      row.className = 'message-row agent';

      function fmt(ms) {
        return ms == null ? '—' : `${ms}ms`;
      }

      let debugHtml = '';
      if (timing) {
        debugHtml = `
          <div class="debug-badge">
            <span>⏱️ ትንታኔ: ${fmt(timing.translateInMs)}</span> |
            <span>🤖 ማሰናዳት: ${fmt(timing.hermesMs)}</span> |
            <span>🇪🇹 ዝግጅት: ${fmt(timing.translateOutMs)}</span> |
            <span>⚡ ጠቅላላ: ${fmt(timing.totalMs)}</span>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="message-bubble">${formatMarkdown(amharicText)}</div>
        ${debugHtml}
      `;
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    function appendPipelineIndicator() {
      const card = document.createElement('div');
      card.className = 'pipeline-status-card';
      const config = stageConfigFor();
      const first = currentLanguage === 'en' ? config.hermes : config.translate_in;
      card.innerHTML = `
        <div class="pulse-ring"></div>
        <span class="status-text">● ${first.step}: ${first.label}</span>
      `;
      chatContainer.appendChild(card);
      scrollToBottom();
      return card;
    }

    function updatePipelineStageStart(card, stage) {
      if (!card) return;
      const config = stageConfigFor()[stage] || { step: '•', label: 'በመስራት ላይ...' };
      const span = card.querySelector('.status-text');
      const ring = card.querySelector('.pulse-ring');
      if (ring) ring.style.display = 'block';
      if (span) {
        span.textContent = `● ${config.step}: ${config.label}`;
      }
    }

    function updatePipelineStageDone(card, stage, durationMs) {
      if (!card) return;
      const config = stageConfigFor()[stage] || { step: '•', label: '' };
      const span = card.querySelector('.status-text');
      if (span && durationMs !== undefined) {
        span.textContent = `✓ ${config.step} ተጠናቋል (${durationMs}ms)...`;
      }
    }

    function appendConfirmationCard(data) {
      const card = document.createElement('div');
      card.className = 'confirmation-card';

      const actionDesc = data.amharic_action_description || data.amharic_prompt || 'የታቀደውን እርምጃ ለማረጋገጥ እርግጠኛ ነዎት?';
      const token = data.confirmation_token;

      card.innerHTML = `
        <div class="conf-header">
          <span>⚠️</span>
          <span>እርምጃ ማረጋገጫ ያስፈልገዋል</span>
        </div>
        <div class="conf-body">
          ${formatMarkdown(actionDesc)}
        </div>
        <div class="conf-actions">
          <button class="btn-confirm" onclick="confirmAction('${token}', this)">አረጋግጣለሁ (Confirm)</button>
          <button class="btn-cancel" onclick="cancelAction(this)">ሰርዝ (Cancel)</button>
        </div>
      `;

      chatContainer.appendChild(card);
      scrollToBottom();
    }

    async function confirmAction(token, btnElement) {
      const card = btnElement.closest('.confirmation-card');
      btnElement.disabled = true;
      btnElement.textContent = 'በማረጋገጥ ላይ...';

      let finalResult = null;

      try {
        await readSSEStream(`${getBaseUrl()}/api/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirmation_token: token })
        }, (event) => {
          if (event.type === 'stage') {
            if (event.stage === 'hermes' && event.status === 'start') {
              btnElement.textContent = '⏳ በማስፈጸም ላይ...';
            } else if (event.stage === 'translate_out' && event.status === 'start') {
              btnElement.textContent = '⏳ መልሱን በማዘጋጀት ላይ...';
            }
          } else if (event.type === 'result') {
            finalResult = event;
          } else if (event.type === 'error') {
            throw new Error(event.message || 'ማረጋገጥ አልተቻለም');
          }
        });

        if (finalResult && finalResult.status === 'success') {
          card.innerHTML = `
            <div class="conf-header" style="color: #22c55e;">
              <span>✅</span>
              <span>እርምጃው ተረጋግጦ ተፈጽሟል</span>
            </div>
            <div class="conf-body">
              ${formatMarkdown(finalResult.amharicResponse)}
            </div>
          `;
        } else {
          throw new Error(finalResult?.message || 'ማረጋገጥ አልተቻለም');
        }
      } catch (err) {
        card.innerHTML = `
          <div class="error-card">
            ❌ ${escapeHtml(err.message)}
          </div>
        `;
      }
      scrollToBottom();
    }

    function cancelAction(btnElement) {
      const card = btnElement.closest('.confirmation-card');
      card.innerHTML = `
        <div style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">
          🚫 እርምጃው በተጠቃሚው ተሰርዟል።
        </div>
      `;
      scrollToBottom();
    }

    function appendErrorMessage(errorText) {
      const card = document.createElement('div');
      card.className = 'error-card';
      card.innerHTML = `
        <span>⚠️</span>
        <span>${escapeHtml(errorText)}</span>
      `;
      chatContainer.appendChild(card);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatMarkdown(text) {
      if (!text) return '';
      let formatted = escapeHtml(text);
      formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      formatted = formatted.replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;">$1</code>');
      return formatted;
    }
  </script>
</body>
</html>
