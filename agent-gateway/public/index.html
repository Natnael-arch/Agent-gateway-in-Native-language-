<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agelgay - AI Assistant</title>
  
  <!-- Google Fonts: Noto Sans Ethiopic & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #161f30;
      --bg-input: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Ochre user bubble colors */
      --user-ochre-from: #d97706;
      --user-ochre-to: #b45309;
      --user-text: #ffffff;
      
      /* Agent reply bubble */
      --agent-bg: #1e293b;
      --agent-border: rgba(255, 255, 255, 0.08);
      
      /* Confirmation teal card */
      --teal-bg: rgba(13, 148, 136, 0.12);
      --teal-border: #0d9488;
      --teal-accent: #14b8a6;
      
      /* Error red card */
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: #ef4444;
      --error-text: #fca5a5;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans Ethiopic', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Header */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-flag {
      font-size: 1.4rem;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .dot.offline {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .url-input {
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      width: 180px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Chat Viewport */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    .chat-container {
      width: 100%;
      max-width: 760px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Chat Messages */
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.agent {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .message-row.user .message-bubble {
      background: linear-gradient(135deg, var(--user-ochre-from) 0%, var(--user-ochre-to) 100%);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.25);
    }

    .message-row.agent .message-bubble {
      background-color: var(--agent-bg);
      border: 1px solid var(--agent-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    /* Pipeline Status Indicator Bubble */
    .pipeline-status-card {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(8px);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      animation: fadeIn 0.2s ease-out;
    }

    .pulse-ring {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--teal-accent);
      position: relative;
    }

    .pulse-ring::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 50%;
      background-color: var(--teal-accent);
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Confirmation Card */
    .confirmation-card {
      width: 100%;
      max-width: 540px;
      align-self: flex-start;
      background: var(--teal-bg);
      border: 1.5px solid var(--teal-border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.15);
      animation: fadeIn 0.25s ease-out;
    }

    .conf-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--teal-accent);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .conf-body {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--teal-accent);
    }

    .conf-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-confirm {
      flex: 1;
      background: var(--teal-accent);
      color: #042f2e;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .btn-confirm:hover {
      background: #2dd4bf;
      transform: translateY(-1px);
    }

    .btn-cancel {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cancel:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    /* Error Bubble */
    .error-card {
      align-self: flex-start;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Debug Metrics Footer Badge */
    .debug-badge {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', monospace;
    }

    .debug-badge span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Suggestion Prompt Chips Bar */
    .suggestions-bar {
      width: 100%;
      max-width: 760px;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .suggestions-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .chip:hover {
      background: rgba(217, 119, 6, 0.15);
      border-color: var(--user-ochre-from);
      color: #fef3c7;
    }

    /* Bottom Composer Container */
    .composer-container {
      width: 100%;
      max-width: 760px;
      padding: 12px 16px 20px 16px;
      background: var(--bg-main);
    }

    .composer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 6px 8px 6px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s;
    }

    .composer-box:focus-within {
      border-color: var(--user-ochre-from);
    }

    .composer-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 8px 0;
      resize: none;
      max-height: 120px;
    }

    .composer-input::placeholder {
      color: #64748b;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #64748b;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-send {
      background: linear-gradient(135deg, var(--user-ochre-from) 0%, var(--user-ochre-to) 100%);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn-send:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 640px) {
      header {
        padding: 10px 12px;
      }
      .brand-subtitle, .url-input {
        display: none;
      }
      .chat-container {
        padding: 12px 10px;
      }
      .message-row {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <span class="brand-flag">🇪🇹</span>
      <div>
        <div class="brand-title">Agelgay</div>
        <div class="brand-subtitle">የእርስዎ አርቴፊሻል ኢንተለጀንስ ረዳት</div>
      </div>
    </div>

    <div class="header-controls">
      <div class="status-badge" id="serverStatusBadge">
        <div class="dot" id="serverDot"></div>
        <span id="serverStatusText">Online</span>
      </div>

      <input type="text" id="baseUrlInput" class="url-input" value="http://localhost:3000" placeholder="Base URL">

      <button class="btn-action" onclick="resetSession()" title="Reset conversation session">New Session</button>
    </div>
  </header>

  <!-- Main Chat Thread Viewport -->
  <main>
    <div class="chat-container" id="chatContainer">
      <!-- Welcome Message -->
      <div class="message-row agent">
        <div class="message-bubble">
👋 **ሰላም! ወደ አገልጋይ እንኳን በደህና መጡ።** እንዴት ልርዳዎት እችላለሁ?
        </div>
      </div>
    </div>

    <!-- Suggestion Prompt Chips -->
    <div class="suggestions-bar">
      <div class="chip" onclick="sendSuggestion('ሰላም፤ 5 + 5 ስንት ይሆናል?')">💡 5 + 5 ስንት ነው?</div>
      <div class="chip" onclick="sendSuggestion('በኢትዮጵያ የሚገኙ ዋና ዋና ከተሞች የትኞቹ ናቸው?')">🇪🇹 ዋና ዋና ከተሞች</div>
      <div class="chip" onclick="sendSuggestion('እባክህ ስለ አየር ሁኔታ አስተያየትህን ጻፍ')">🌦️ ስለ አየር ሁኔታ ጻፍ</div>
      <div class="chip" onclick="sendSuggestion('500 ብር ወደ አካውንት 987654 ላክ')">⚠️ እርምጃ ማረጋገጫ (500 ብር)</div>
    </div>

    <!-- Bottom Composer Bar -->
    <div class="composer-container">
      <form class="composer-box" id="chatForm" onsubmit="handleSend(event)">
        <!-- Mic Icon Placeholder -->
        <button type="button" class="icon-btn" title="ድምፅ ግቤት (በቅርቡ የሚመጣ)" onclick="alert('ድምፅ ግቤት በቅርቡ ይለቀቃል!')">
          🎤
        </button>

        <input type="text" id="messageInput" class="composer-input" placeholder="መልእክትዎን እዚህ ይጻፉ... (Enter ለመላክ)" autocomplete="off" required>

        <button type="submit" id="sendBtn" class="btn-send">
          <span>መላክ</span>
          <span>➔</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    // Client-Side Session State
    let currentSessionId = 'session_' + Math.random().toString(36).substring(2, 9);
    
    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const baseUrlInput = document.getElementById('baseUrlInput');
    const serverDot = document.getElementById('serverDot');
    const serverStatusText = document.getElementById('serverStatusText');

    function getBaseUrl() {
      const val = baseUrlInput.value.trim().replace(/\/+$/, '');
      if (val) return val;
      return (window.location.origin && window.location.origin !== 'null') ? window.location.origin : 'http://localhost:3000';
    }

    if (window.location.origin && window.location.origin !== 'null' && window.location.protocol.startsWith('http')) {
      baseUrlInput.value = window.location.origin;
    }

    // Check Gateway Server Health
    async function checkHealth() {
      try {
        const res = await fetch(`${getBaseUrl()}/health`, { signal: AbortSignal.timeout(3000) });
        if (res.ok) {
          const data = await res.json();
          serverDot.classList.remove('offline');
          serverStatusText.textContent = `Online (${data.mockTranslationMode ? 'Mock' : 'Live'})`;
        } else {
          throw new Error();
        }
      } catch (e) {
        serverDot.classList.add('offline');
        serverStatusText.textContent = 'Offline';
      }
    }

    setInterval(checkHealth, 10000);
    checkHealth();

    function resetSession() {
      currentSessionId = 'session_' + Math.random().toString(36).substring(2, 9);
      chatContainer.innerHTML = `
        <div class="message-row agent">
          <div class="message-bubble">
🔄 **አዲስ ውይይት ተጀምሯል።** (Session ID: ${currentSessionId})
እባክዎን ጥያቄዎን ወይም ትእዛዝዎን በአማርኛ ያስገቡ።
          </div>
        </div>
      `;
    }

    function sendSuggestion(text) {
      messageInput.value = text;
      handleSend(new Event('submit'));
    }

    // Helper function to read SSE streams over HTTP POST fetch
    async function readSSEStream(url, options, onEvent) {
      const response = await fetch(url, options);

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || errorData.message || `Server Error ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let receivedTerminalEvent = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop(); // Retain incomplete block

        for (const block of blocks) {
          const trimmed = block.trim();
          if (!trimmed) continue;

          const dataLines = trimmed
            .split('\n')
            .filter(line => line.startsWith('data: '))
            .map(line => line.substring(6));

          for (const dataStr of dataLines) {
            try {
              const event = JSON.parse(dataStr);
              if (event.type === 'result' || event.type === 'error') {
                receivedTerminalEvent = true;
              }
              onEvent(event);
            } catch (e) {
              console.error('SSE parse error:', dataStr, e);
            }
          }
        }
      }

      if (!receivedTerminalEvent) {
        throw new Error('የግንኙነት መስመሩ በድንገት ተቋርጧል። እባክዎን እንደገና ይሞክሩ።');
      }
    }

    const STAGE_CONFIG = {
      translate_in: { step: '1/3', label: 'ጥያቄዎን በመተንተን ላይ...' },
      hermes: { step: '2/3', label: 'መልስ በመፈለግ እና በመስራት ላይ...' },
      translate_out: { step: '3/3', label: 'መልሱን በማዘጋጀት ላይ...' }
    };

    // Main Send Handler
    async function handleSend(e) {
      if (e) e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      // Render User Message
      appendUserMessage(text);
      messageInput.value = '';
      sendBtn.disabled = true;

      // Render Pipeline Loading Indicator immediately
      const pipelineCard = appendPipelineIndicator();
      updatePipelineStageStart(pipelineCard, 'translate_in');
      let finalResult = null;

      try {
        await readSSEStream(`${getBaseUrl()}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            sessionId: currentSessionId
          })
        }, (event) => {
          if (event.type === 'stage') {
            if (event.status === 'start') {
              updatePipelineStageStart(pipelineCard, event.stage);
            } else if (event.status === 'done') {
              updatePipelineStageDone(pipelineCard, event.stage, event.durationMs);
            }
          } else if (event.type === 'result' || event.type === 'error') {
            finalResult = event;
          }
        });

        // Remove pipeline indicator when stream completes cleanly
        pipelineCard?.remove();

        if (finalResult) {
          if (finalResult.type === 'error') {
            throw new Error(finalResult.message || 'ስህተት አጋጥሟል');
          } else if (finalResult.requires_confirmation || finalResult.status === 'confirmation_required') {
            appendConfirmationCard(finalResult);
          } else if (finalResult.status === 'success') {
            appendAgentMessage(finalResult.amharicResponse, finalResult.timing, finalResult.englishResponse);
          } else {
            throw new Error(finalResult.message || 'ስህተት አጋጥሟል');
          }
        }

      } catch (err) {
        pipelineCard?.remove();
        appendErrorMessage(err.message || 'ይቅርታ፣ ጥያቄዎን ማስተላለፍ አልቻልኩም። እባክዎ እንደገና ይሞክሩ።');
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    }

    // Render User Bubble (Ochre)
    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    // Render Agent Bubble (Slate Card)
    function appendAgentMessage(amharicText, timing = null, englishResponse = null) {
      const row = document.createElement('div');
      row.className = 'message-row agent';

      let debugHtml = '';
      if (timing) {
        debugHtml = `
          <div class="debug-badge">
            <span>⏱️ ትንታኔ: ${timing.translateInMs}ms</span> |
            <span>🤖 ማሰናዳት: ${timing.hermesMs}ms</span> |
            <span>🇪🇹 ዝግጅት: ${timing.translateOutMs}ms</span> |
            <span>⚡ ጠቅላላ: ${timing.totalMs}ms</span>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="message-bubble">${formatMarkdown(amharicText)}</div>
        ${debugHtml}
      `;
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    // Render Pipeline Indicator
    function appendPipelineIndicator() {
      const card = document.createElement('div');
      card.className = 'pipeline-status-card';
      card.innerHTML = `
        <div class="pulse-ring"></div>
        <span class="status-text">● 1/3: ጥያቄዎን በመተንተን ላይ...</span>
      `;
      chatContainer.appendChild(card);
      scrollToBottom();
      return card;
    }

    function updatePipelineStageStart(card, stage) {
      if (!card) return;
      const config = STAGE_CONFIG[stage] || { step: '•', label: 'በመስራት ላይ...' };
      const span = card.querySelector('.status-text');
      const ring = card.querySelector('.pulse-ring');
      if (ring) ring.style.display = 'block';
      if (span) {
        span.textContent = `● ${config.step}: ${config.label}`;
      }
    }

    function updatePipelineStageDone(card, stage, durationMs) {
      if (!card) return;
      const config = STAGE_CONFIG[stage] || { step: '•', label: '' };
      const span = card.querySelector('.status-text');
      if (span && durationMs !== undefined) {
        span.textContent = `✓ ${config.step} ተጠናቋል (${durationMs}ms)...`;
      }
    }

    // Render Confirmation Card for Consequential Actions
    function appendConfirmationCard(data) {
      const card = document.createElement('div');
      card.className = 'confirmation-card';

      const actionDesc = data.amharic_action_description || data.amharic_prompt || 'የታቀደውን እርምጃ ለማረጋገጥ እርግጠኛ ነዎት?';
      const token = data.confirmation_token;

      card.innerHTML = `
        <div class="conf-header">
          <span>⚠️</span>
          <span>እርምጃ ማረጋገጫ ያስፈልገዋል</span>
        </div>
        <div class="conf-body">
          ${formatMarkdown(actionDesc)}
        </div>
        <div class="conf-actions">
          <button class="btn-confirm" onclick="confirmAction('${token}', this)">አረጋግጣለሁ (Confirm)</button>
          <button class="btn-cancel" onclick="cancelAction(this)">ሰርዝ (Cancel)</button>
        </div>
      `;

      chatContainer.appendChild(card);
      scrollToBottom();
    }

    // Submit Action Confirmation
    async function confirmAction(token, btnElement) {
      const card = btnElement.closest('.confirmation-card');
      btnElement.disabled = true;
      btnElement.textContent = 'በማረጋገጥ ላይ...';

      let finalResult = null;

      try {
        await readSSEStream(`${getBaseUrl()}/api/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirmation_token: token })
        }, (event) => {
          if (event.type === 'stage') {
            if (event.stage === 'hermes' && event.status === 'start') {
              btnElement.textContent = '⏳ በማስፈጸም ላይ...';
            } else if (event.stage === 'translate_out' && event.status === 'start') {
              btnElement.textContent = '⏳ መልሱን በማዘጋጀት ላይ...';
            }
          } else if (event.type === 'result') {
            finalResult = event;
          } else if (event.type === 'error') {
            throw new Error(event.message || 'ማረጋገጥ አልተቻለም');
          }
        });

        if (finalResult && finalResult.status === 'success') {
          card.innerHTML = `
            <div class="conf-header" style="color: #22c55e;">
              <span>✅</span>
              <span>እርምጃው ተረጋግጦ ተፈጽሟል</span>
            </div>
            <div class="conf-body">
              ${formatMarkdown(finalResult.amharicResponse)}
            </div>
          `;
        } else {
          throw new Error(finalResult?.message || 'ማረጋገጥ አልተቻለም');
        }
      } catch (err) {
        card.innerHTML = `
          <div class="error-card">
            ❌ ${escapeHtml(err.message)}
          </div>
        `;
      }
      scrollToBottom();
    }

    // Cancel Action Confirmation
    function cancelAction(btnElement) {
      const card = btnElement.closest('.confirmation-card');
      card.innerHTML = `
        <div style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">
          🚫 እርምጃው በተጠቃሚው ተሰርዟል።
        </div>
      `;
      scrollToBottom();
    }

    // Render Error Message
    function appendErrorMessage(errorText) {
      const card = document.createElement('div');
      card.className = 'error-card';
      card.innerHTML = `
        <span>⚠️</span>
        <span>${escapeHtml(errorText)}</span>
      `;
      chatContainer.appendChild(card);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatMarkdown(text) {
      if (!text) return '';
      let formatted = escapeHtml(text);
      // Basic bold formatting
      formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Basic code block / inline code
      formatted = formatted.replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;">$1</code>');
      return formatted;
    }
  </script>
</body>
</html>
